services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env or the shell}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      DATABASE_URL: postgres://adorable:${POSTGRES_PASSWORD:-adorable}@db:5432/adorable
      AUTH_EMAIL_HEADER: ${AUTH_EMAIL_HEADER:-cf-access-authenticated-user-email}
      DAILY_GENERATION_LIMIT: ${DAILY_GENERATION_LIMIT:-50}
      # DEV_USER: dev@local   # uncomment ONLY for local trials without an SSO proxy
    volumes:
      - published:/app/server/published
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adorable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adorable}
      POSTGRES_DB: adorable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adorable"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  published:
